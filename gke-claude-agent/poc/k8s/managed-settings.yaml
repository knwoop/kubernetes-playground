apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-managed-settings
  namespace: claude-poc
data:
  managed-settings.json: |
    {
      "forceLoginMethod": "claudeai",
      "forceLoginOrgUUID": "REPLACE-WITH-YOUR-ORG-UUID",
      "permissions": {
        "deny": [
          "Read(//home/claude/.claude/.credentials.json)",
          "Read(//home/claude/.claude.json)",
          "Read(//home/claude/.claude/**/.credentials.json)"
        ]
      }
    }
