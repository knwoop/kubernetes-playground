apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude
  namespace: claude-poc
spec:
  serviceName: claude
  replicas: 1
  selector:
    matchLabels: {app: claude}
  template:
    metadata:
      labels: {app: claude}
    spec:
      serviceAccountName: claude
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: claude
          image: ${CLAUDE_POC_IMAGE}
          workingDir: /workspace/repo
          env:
            - {name: CLAUDE_CONFIG_DIR, value: /home/claude/.claude}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}
            limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 5Gi}
          volumeMounts:
            - {name: claude-config, mountPath: /home/claude/.claude}
            - name: managed-settings
              mountPath: /etc/claude-code/managed-settings.json
              subPath: managed-settings.json
              readOnly: true
      volumes:
        - name: managed-settings
          configMap: {name: claude-managed-settings}
  volumeClaimTemplates:
    - metadata: {name: claude-config}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 1Gi}}
